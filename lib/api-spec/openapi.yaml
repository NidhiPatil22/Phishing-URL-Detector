openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
  - name: scans
  - name: dashboard
  - name: model
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      responses:
        "204":
          description: Signed out
  /scans:
    get:
      operationId: listScans
      tags: [scans]
      summary: List scan history
      parameters:
        - {name: search, in: query, schema: {type: string}}
        - {name: verdict, in: query, schema: {type: string, enum: [all, safe, phishing], default: all}}
        - {name: minRisk, in: query, schema: {type: number, minimum: 0, maximum: 100}}
        - {name: maxRisk, in: query, schema: {type: number, minimum: 0, maximum: 100}}
      responses:
        "200":
          description: Scan history
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Scan"}
    post:
      operationId: createScan
      tags: [scans]
      summary: Analyze a URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanInput"
      responses:
        "201":
          description: Scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
  /scans/{id}:
    get:
      operationId: getScan
      tags: [scans]
      summary: Get scan details
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Scan details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard metrics
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
  /model-info:
    get:
      operationId: getModelInfo
      tags: [model]
      summary: Get model metadata
      responses:
        "200":
          description: Model metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelInfo"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: string}
        role: {type: string, enum: [user, admin]}
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: {type: string}
        password: {type: string, minLength: 6}
    SignupInput:
      type: object
      required: [name, email, password]
      properties:
        name: {type: string, minLength: 2}
        email: {type: string}
        password: {type: string, minLength: 6}
    AuthResponse:
      type: object
      required: [user]
      properties:
        user: {$ref: "#/components/schemas/User"}
    ScanInput:
      type: object
      required: [url]
      properties:
        url: {type: string, minLength: 4}
    Scan:
      type: object
      required: [id, url, verdict, confidence, riskScore, ruleFlags, features, mlPrediction, rulePrediction, createdAt, userName, brandImpersonation, similarityScore, urlIntelligence]
      properties:
        id: {type: string}
        url: {type: string}
        verdict: {type: string, enum: [safe, phishing]}
        confidence: {type: number}
        riskScore: {type: number}
        ruleFlags: {type: array, items: {type: string}}
        features: {type: object, additionalProperties: true}
        mlPrediction: {type: string, enum: [safe, phishing]}
        rulePrediction: {type: string, enum: [safe, phishing]}
        createdAt: {type: string}
        userName: {type: string}
        brandImpersonation: {type: boolean}
        impersonatedBrand: {type: string, nullable: true}
        legitimateDomain: {type: string, nullable: true}
        similarityScore: {type: number}
        impersonationReason: {type: string, nullable: true}
        urlIntelligence: {$ref: "#/components/schemas/UrlIntelligence"}
    UrlIntelligence:
      type: object
      required:
        - protocol
        - hostname
        - registrableDomain
        - subdomainCount
        - port
        - path
        - queryParameterCount
        - queryParameterNames
        - hasFragment
        - urlLength
        - httpsEnabled
      properties:
        protocol: {type: string}
        hostname: {type: string}
        registrableDomain: {type: string}
        subdomainCount: {type: number}
        port: {type: number}
        path: {type: string}
        queryParameterCount: {type: number}
        queryParameterNames: {type: array, items: {type: string}}
        hasFragment: {type: boolean}
        urlLength: {type: number}
        ipAddress: {type: string, nullable: true}
        ipVersion: {type: string, nullable: true}
        httpsEnabled: {type: boolean}
    DashboardStats:
      type: object
      required: [totalScanned, maliciousDetected, safeUrls, modelAccuracy, phishingPercent, safePercent, recentScans]
      properties:
        totalScanned: {type: number}
        maliciousDetected: {type: number}
        safeUrls: {type: number}
        modelAccuracy: {type: number}
        phishingPercent: {type: number}
        safePercent: {type: number}
        recentScans: {type: array, items: {$ref: "#/components/schemas/Scan"}}
    ModelInfo:
      type: object
      required: [accuracy, precision, recall, f1Score, datasetSize, phishingCount, legitimateCount, trainedAt, featureImportance, features]
      properties:
        accuracy: {type: number}
        precision: {type: number}
        recall: {type: number}
        f1Score: {type: number}
        datasetSize: {type: number}
        phishingCount: {type: number}
        legitimateCount: {type: number}
        trainedAt: {type: string}
        featureImportance: {type: array, items: {$ref: "#/components/schemas/FeatureImportance"}}
        features: {type: array, items: {$ref: "#/components/schemas/FeatureDefinition"}}
    FeatureImportance:
      type: object
      required: [name, importance]
      properties:
        name: {type: string}
        importance: {type: number}
    FeatureDefinition:
      type: object
      required: [name, description]
      properties:
        name: {type: string}
        description: {type: string}

